<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Travel - Company</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#f5f7fb;display:flex}#side{width:240px;background:#fff;border-right:1px solid #e5e7eb;padding:20px 12px;position:fixed;height:100vh}#main{margin-left:240px;flex:1;padding:20px}.logo{font-weight:800;font-size:20px}.m{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:4px}.m.on{background:#dbeafe;color:#2563eb;font-weight:600}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px}input,select,button{padding:10px;border:1px solid #ddd;border-radius:6px;margin:4px}button{background:#2563eb;color:#fff;border:none;cursor:pointer;font-weight:600}</style></head><body><div id="side"><div class="logo">🚌 Daily Travel</div><div id="info" style="font-size:11px;color:#666;margin:10px 0"></div><div class="m on" onclick="showM('overview',this)">Overview</div><div class="m" onclick="showM('routes',this)">Routes</div><div class="m" onclick="showM('buses',this)">Buses</div><div class="m" onclick="showM('bookings',this)">Bookings</div><div class="m" onclick="showM('earnings',this)">Earnings</div><div class="m" onclick="logout()" style="color:red;margin-top:20px">Logout</div></div><div id="main"><div id="content">Loading...</div></div><script>
const supabase=window.supabase.createClient('https://skttacgyeghuzaplpeop.supabase.co','sb_publishable_v5etAOTCAkpY25gdvEaAwg_7p0wztgF');
let currentCompany=null;
async function init(){
 const{data:{user}}=await supabase.auth.getUser();
 if(!user){showLogin();return;}
 document.getElementById('content').innerHTML='Finding your company...';
 const {data:byEmail, error:emailErr} = await supabase.from('bus_companies').select('*').eq('email', user.email).maybeSingle();
 if(byEmail){ currentCompany=byEmail; }
 else {
   // NO fallback to all[0] - force user to fix email
   const {data:all}=await supabase.from('bus_companies').select('id,company_name,email');
   let list = (all||[]).map(c=>`<div style="padding:8px;border:1px solid #eee;margin:4px"><b>${c.company_name}</b><br>${c.id}<br>email:${c.email||'EMPTY'}<br><button onclick="linkCompany('${c.id}')">Use this company for ${user.email}</button></div>`).join('');
   document.getElementById('content').innerHTML=`<div class="card"><h3>Company link missing</h3><p>Your login: <b>${user.email}</b></p><p>No bus_companies row has email = ${user.email}</p><p>Click to link:</p>${list}<p style="margin-top:10px;color:#666">Or go to Supabase > bus_companies > set email column to ${user.email}</p></div>`;
   return;
 }
 if(currentCompany.is_suspended){document.getElementById('content').innerHTML='<div class="card"><h3 style="color:red">Company Suspended</h3><p>Contact Admin: pascallouis854@gmail.com</p></div>';return;}
 document.getElementById('info').innerHTML=`<b>${currentCompany.company_name}</b><br>${currentCompany.email}<br><span style="color:green">● ${currentCompany.id.substring(0,8)}...</span>`;
 showM('overview',document.querySelector('.m.on'));
}
async function linkCompany(companyId){
 const{data:{user}}=await supabase.auth.getUser();
 const {error}=await supabase.from('bus_companies').update({email:user.email}).eq('id',companyId);
 if(error){alert('Failed: '+error.message);return;} alert('Linked! Reloading...'); location.reload();
}
function showLogin(){document.getElementById('content').innerHTML='<div class="card" style="max-width:360px;margin:60px auto"><h2>Company Login</h2><input id="email" placeholder="Email" style="width:100%"><input id="pass" type="password" placeholder="Password" style="width:100%"><button onclick="doLogin()" style="width:100%">Login</button><p id="msg" style="color:red"></p></div>';}
async function doLogin(){const e=document.getElementById('email').value;const p=document.getElementById('pass').value;document.getElementById('msg').innerText='...';const{error}=await supabase.auth.signInWithPassword({email:e,password:p});if(error){document.getElementById('msg').innerText=error.message;return;}init();}
async function logout(){await supabase.auth.signOut();location.reload();}
async function showM(name,el){
 if(el){document.querySelectorAll('.m').forEach(x=>x.classList.remove('on'));el.classList.add('on');}
 const c=document.getElementById('content');
 if(name==='overview'){
  const{data:bk}=await supabase.from('bookings').select('*').eq('company_id',currentCompany.id).limit(100);
  const{data:rt}=await supabase.from('routes').select('*').eq('company_id',currentCompany.id);
  const tot=(bk||[]).reduce((s,b)=>s+Number(b.total_amount||b.amount||0),0);
  c.innerHTML=`<div class="card"><h2>${currentCompany.company_name}</h2><p>ID: ${currentCompany.id}</p><p>Email: ${currentCompany.email}</p></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><div class="card">Gross<br><b>UGX ${tot.toLocaleString()}</b></div><div class="card">Routes<br><b>${rt?.length||0}</b></div><div class="card">Bookings<br><b>${bk?.length||0}</b></div></div><div class="card">✅ Multi-tenant FIXED - Each company uses its own ID</div>`;
 }
 if(name==='routes'){
  c.innerHTML=`<div class="card"><h2>Add Route - ${currentCompany.company_name}</h2><input id="oc" placeholder="Origin City e.g Kampala"><input id="dc" placeholder="Dest City e.g Gulu"><input id="ot" placeholder="Origin Terminal e.g Paidha Park"><input id="dt2" placeholder="Dest Terminal e.g Gulu Main"><input id="fare" type="number" placeholder="Fare 40000"><button onclick="addRoute()">Add Route</button><p id="rmsg"></p></div><div class="card"><h3>My Routes</h3><div id="rlist">Loading...</div></div>`; loadRoutes();
 }
 if(name==='bookings'){
  const{data}=await supabase.from('bookings').select('*').eq('company_id',currentCompany.id).order('created_at',{ascending:false}).limit(50);
  c.innerHTML='<div class="card"><h2>Bookings</h2>'+((data||[]).map(b=>`<div style="padding:8px;border-bottom:1px solid #eee">${b.passenger_name||'Customer'} - ${b.origin_city||''}->${b.destination_city||''} UGX ${b.total_amount||b.amount||0}</div>`).join('')||'No bookings')+'</div>';
 }
 if(name==='earnings'){
  const{data}=await supabase.from('bookings').select('*').eq('company_id',currentCompany.id);
  const tot=(data||[]).reduce((s,b)=>s+Number(b.total_amount||b.amount||0),0);
  c.innerHTML=`<div class="card"><h2>Earnings</h2><p>Gross: UGX ${tot.toLocaleString()}</p><p>Your 90%: UGX ${Math.round(tot*0.9).toLocaleString()}</p><p>Admin 10%: UGX ${Math.round(tot*0.1).toLocaleString()}</p></div>`;
 }
 if(name==='buses'){c.innerHTML='<div class="card"><h2>Buses - Coming, send buses table definition</h2><div id="blist"></div></div>'; loadBuses();}
}
async function loadRoutes(){
 const{data,error}=await supabase.from('routes').select('*').eq('company_id',currentCompany.id).order('created_at',{ascending:false});
 if(error){document.getElementById('rlist').innerText='Error: '+error.message; console.error(error); return;}
 document.getElementById('rlist').innerHTML=(data||[]).map(r=>`<div style="padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><span>${r.origin_city||r.from_city||''} → ${r.destination_city||r.to_city||''} | ${r.origin_terminal||''}→${r.destination_terminal||''} - UGX ${r.base_fare||r.price||0}</span><button onclick="delRoute('${r.id}')" style="background:red">Delete</button></div>`).join('')||'No routes - add one above';
}
async function addRoute(){
 const oc=document.getElementById('oc').value.trim();const dc=document.getElementById('dc').value.trim();const ot=document.getElementById('ot').value.trim();const dt=document.getElementById('dt2').value.trim();const fare=parseInt(document.getElementById('fare').value)||0;
 const msg=document.getElementById('rmsg'); if(!oc||!dc||!ot||!dt){msg.innerText='Fill all fields';msg.style.color='red';return;}
 msg.innerText='Adding...';msg.style.color='blue';
 // Insert BOTH old and new column names for compatibility
 const payload={
   company_id: currentCompany.id,
   origin_city: oc, destination_city: dc,
   origin_terminal: ot, destination_terminal: dt,
   base_fare: fare,
   from_city: oc, to_city: dc, price: fare, // backward compat
   fare: fare, status: 'active'
 };
 const {error}=await supabase.from('routes').insert([payload]);
 if(error){msg.innerText='ERROR: '+error.message;msg.style.color='red';alert('Failed: '+error.message+'\n\nCheck: Did you run the ALTER TABLE SQL?');console.error(error);return;}
 msg.innerText='Success! Route added for '+currentCompany.company_name;msg.style.color='green';
 document.getElementById('oc').value='';document.getElementById('dc').value='';document.getElementById('ot').value='';document.getElementById('dt2').value='';document.getElementById('fare').value='';
 loadRoutes();
}
async function delRoute(id){if(!confirm('Delete?'))return;const {error}=await supabase.from('routes').delete().eq('id',id);if(error){alert(error.message);return;}loadRoutes();}
async function loadBuses(){const{data,error}=await supabase.from('buses').select('*').eq('company_id',currentCompany.id).limit(20);const el=document.getElementById('blist');if(!el)return;if(error){el.innerText='Error: '+error.message;return;}el.innerHTML='<pre>'+JSON.stringify(data||[],null,2)+'</pre>';}
init();
</script></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Travel - Company</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#f5f7fb;display:flex}#side{width:240px;background:#fff;border-right:1px solid #e5e7eb;padding:20px 12px;position:fixed;height:100vh;overflow:auto}#main{margin-left:240px;flex:1;padding:20px;min-height:100vh}.logo{font-weight:800;font-size:20px;margin-bottom:12px}.m{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:4px}.m.on{background:#dbeafe;color:#2563eb;font-weight:600}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}input,select,button{padding:10px;border:1px solid #ddd;border-radius:6px;margin:4px}button{background:#2563eb;color:#fff;border:none;cursor:pointer;font-weight:600}button:disabled{opacity:.6}</style></head><body><div id="side"><div class="logo">🚌 Daily Travel</div><div id="info" style="font-size:12px;color:#666;margin-bottom:16px"></div><div class="m on" onclick="showM('overview',this)">Overview</div><div class="m" onclick="showM('routes',this)">Routes</div><div class="m" onclick="showM('buses',this)">Buses</div><div class="m" onclick="showM('schedules',this)">Schedules</div><div class="m" onclick="showM('bookings',this)">Bookings</div><div class="m" onclick="showM('earnings',this)">Earnings</div><div class="m" onclick="logout()" style="color:red;margin-top:20px">Logout</div></div><div id="main"><div id="content">Loading...</div></div><script>
const supabase=window.supabase.createClient('https://skttacgyeghuzaplpeop.supabase.co','sb_publishable_v5etAOTCAkpY25gdvEaAwg_7p0wztgF');
let currentCompany=null;
async function init(){
 const{data:{user}}=await supabase.auth.getUser();
 if(!user){showLogin();return;}
 document.getElementById('content').innerHTML='Finding your company...';
 let comp=null;
 const{data:byEmail}=await supabase.from('bus_companies').select('*').eq('email',user.email).maybeSingle();
 if(byEmail) comp=byEmail;
 if(!comp){
   const{data:all}=await supabase.from('bus_companies').select('*');
   if(all && all.length>0) comp=all[0];
 }
 if(!comp){
   document.getElementById('content').innerHTML='<div class="card"><h3>Company not found</h3><p>Your login: '+user.email+'</p><p>No row in bus_companies has this email. Go to Supabase > bus_companies table > set email = '+user.email+' for your company.</p></div>';
   return;
 }
 currentCompany=comp;
 document.getElementById('info').innerHTML='<b>'+(comp.company_name||'Company')+'</b><br>'+comp.email+'<br><span style="color:green">● Live - Multi-tenant</span><br><small style="word-break:break-all">'+comp.id+'</small>';
 showM('overview',document.querySelector('.m.on'));
}
function showLogin(){document.getElementById('content').innerHTML='<div class="card" style="max-width:380px;margin:60px auto"><h2>Company Login</h2><input id="email" placeholder="Email" style="width:100%"><input id="pass" type="password" placeholder="Password" style="width:100%"><button onclick="doLogin()" style="width:100%">Login</button><p id="msg" style="color:red"></p><p style="font-size:12px;margin-top:10px">Each company must have its email set in bus_companies table</p></div>';}
async function doLogin(){const e=document.getElementById('email').value;const p=document.getElementById('pass').value;document.getElementById('msg').innerText='...';const{error}=await supabase.auth.signInWithPassword({email:e,password:p});if(error){document.getElementById('msg').innerText=error.message;return;}init();}
async function logout(){await supabase.auth.signOut();location.reload();}
async function showM(name,el){
 if(el){document.querySelectorAll('.m').forEach(x=>x.classList.remove('on'));el.classList.add('on');}
 const c=document.getElementById('content');
 if(name==='overview'){
  const{data:bk}=await supabase.from('bookings').select('*').eq('company_id',currentCompany.id).limit(100);
  const{data:rt}=await supabase.from('routes').select('*').eq('company_id',currentCompany.id);
  const tot=(bk||[]).reduce((s,b)=>s+Number(b.amount||b.total_amount||0),0);
  c.innerHTML='<div class="card"><h1>Overview - '+currentCompany.company_name+'</h1><p>Company ID: '+currentCompany.id+'</p></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><div class="card">Gross<br><b>UGX '+tot.toLocaleString()+'</b></div><div class="card">My Routes<br><b>'+(rt?.length||0)+'</b></div><div class="card">My Bookings<br><b>'+(bk?.length||0)+'</b></div></div><div class="card">✅ Multi-tenant working - Each company sees only its own data</div>';
 }
 if(name==='routes'){
  c.innerHTML='<div class="card"><h2>Add Route for '+currentCompany.company_name+'</h2><input id="oc" placeholder="Origin City"><input id="dc" placeholder="Destination City"><input id="ot" placeholder="Origin Terminal e.g Paidha Park"><input id="dt2" placeholder="Destination Terminal e.g Kampala"><input id="fare" type="number" placeholder="Base Fare 35000"><button onclick="addRoute()">Add Route</button><p id="rmsg" style="color:red"></p></div><div class="card"><div id="rlist">Loading...</div></div>';
  loadRoutes();
 }
 if(name==='buses'){c.innerHTML='<div class="card"><h2>Buses for '+currentCompany.company_name+'</h2><div id="blist">Loading...</div></div>';loadBuses();}
 if(name==='bookings'){
  const{data}=await supabase.from('bookings').select('*').eq('company_id',currentCompany.id).order('created_at',{ascending:false}).limit(50);
  c.innerHTML='<div class="card"><h2>Bookings - '+currentCompany.company_name+'</h2>'+(data||[]).map(b=>'<div style="padding:8px;border-bottom:1px solid #eee">'+(b.passenger_name||'Customer')+' - UGX '+(b.amount||0)+'</div>').join('')||'No bookings yet'+'</div>';
 }
 if(name==='earnings'){
  const{data}=await supabase.from('bookings').select('*').eq('company_id',currentCompany.id);
  const tot=(data||[]).reduce((s,b)=>s+Number(b.amount||0),0);
  c.innerHTML='<div class="card"><h2>Earnings - '+currentCompany.company_name+'</h2><p>Total: UGX '+tot.toLocaleString()+'</p><p>Net 90%: UGX '+Math.round(tot*0.9).toLocaleString()+'</p></div>';
 }
 if(name==='schedules'){c.innerHTML='<div class="card"><h2>Schedules</h2><p>Coming - send me schedules table definition</p><div id="slist"></div></div>';}
}
async function loadRoutes(){
 const{data,error}=await supabase.from('routes').select('*').eq('company_id',currentCompany.id).order('created_at',{ascending:false});
 if(error){document.getElementById('rlist').innerText='Error: '+error.message;return;}
 document.getElementById('rlist').innerHTML=(data||[]).map(r=>'<div style="padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><span>'+(r.origin_city||'')+' → '+(r.destination_city||'')+' | '+r.origin_terminal+'→'+r.destination_terminal+' - UGX '+(r.base_fare||0)+'</span><button onclick="delRoute(\''+r.id+'\')">Delete</button></div>').join('')||'No routes yet - Add one above';
}
async function addRoute(){
 const oc=document.getElementById('oc').value.trim();const dc=document.getElementById('dc').value.trim();const ot=document.getElementById('ot').value.trim();const dt=document.getElementById('dt2').value.trim();const fare=document.getElementById('fare').value;
 const msg=document.getElementById('rmsg');
 if(!oc||!dc||!ot||!dt){msg.innerText='Fill all fields';return;}
 msg.innerText='Adding...';
 const{error}=await supabase.from('routes').insert([{company_id:currentCompany.id,origin_city:oc,destination_city:dc,origin_terminal:ot,destination_terminal:dt,base_fare:parseInt(fare)||0}]);
 if(error){msg.innerText='ERROR: '+error.message; alert('Failed: '+error.message); console.error(error); return;}
 msg.innerText='Success!';
 document.getElementById('oc').value='';document.getElementById('dc').value='';document.getElementById('ot').value='';document.getElementById('dt2').value='';document.getElementById('fare').value='';
 loadRoutes();
}
async function delRoute(id){if(!confirm('Delete route?'))return;await supabase.from('routes').delete().eq('id',id);loadRoutes();}
async function loadBuses(){const{data,error}=await supabase.from('buses').select('*').eq('company_id',currentCompany.id).limit(20);if(error){document.getElementById('blist').innerText='Error: '+error.message;return;}document.getElementById('blist').innerHTML='<pre>'+JSON.stringify(data||[],null,2).substring(0,2000)+'</pre><p>Send me buses table definition to build add form</p>';}
init();
</script></body></html>

  <script type="module">
import { createClient as createSupabaseClient } from "https://esm.sh/@supabase/supabase-js@2";

const DAILY_TRAVEL_SUPABASE_URL = "https://skttacgyeghuzaplpeop.supabase.co";
const DAILY_TRAVEL_SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_v5etAOTCAkpY25gdvEaAwg_7p0wztgF";
const dailyTravelSupabase = createSupabaseClient(
  DAILY_TRAVEL_SUPABASE_URL,
  DAILY_TRAVEL_SUPABASE_PUBLISHABLE_KEY,
);

// Expose the publishable client for the bundled app and manual integrations.
window.dailyTravelSupabase = dailyTravelSupabase;

const dailyTravelIsUuid = (value) =>
  typeof value === "string" &&
  /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(
    value,
  );
const dailyTravelAsRows = (value) => (Array.isArray(value) ? value : [value]);
const dailyTravelHash = async (value) => {
  const bytes = new TextEncoder().encode(String(value || ""));
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest), (byte) =>
    byte.toString(16).padStart(2, "0"),
  ).join("");
};

// Compatibility adapter for the existing bundle. It translates prototype field
// names to the live schema and creates the related payment/ticket records.
const dailyTravelSupabaseBridge = {
  auth: dailyTravelSupabase.auth,
  channel: (...args) => dailyTravelSupabase.channel(...args),
  from(table) {
    const builder = dailyTravelSupabase.from(table);
    const originalInsert = builder.insert.bind(builder);
    builder.insert = (values, options) => {
      const rows = dailyTravelAsRows(values);
      if (table === "users") {
        return Promise.resolve()
          .then(async () => {
            const payload = await Promise.all(
              rows.map(async (row) => {
              const next = { ...row };
              if (!dailyTravelIsUuid(next.id)) delete next.id;
              delete next.password;
              delete next.avatar;
              next.profile_picture_url = next.profile_picture_url || null;
              next.password_hash = await dailyTravelHash(next.password_hash);
              return next;
              }),
            );
            return originalInsert(payload, options);
          });
      }
      if (table === "bus_companies") {
        const payload = rows.map((row) => {
          const next = { ...row };
          next.merchant_mtn_code = next.merchant_mtn_code || next.mtn_momo_code || null;
          next.merchant_airtel_code =
            next.merchant_airtel_code || next.airtel_money_code || null;
          next.operating_location = next.operating_location || next.location || null;
          next.logo_url = next.logo_url || next.logo || null;
          next.registration_number =
            next.registration_number || next.regNo || null;
          next.description = next.description || next.desc || null;
          delete next.mtn_momo_code;
          delete next.airtel_money_code;
          delete next.location;
          delete next.logo;
          delete next.password;
          delete next.regNo;
          delete next.desc;
          return next;
        });
        return originalInsert(payload, options);
      }
      if (table === "audit_logs") {
        const payload = rows.map((row) => {
          const next = { ...row };
          delete next.id;
          next.reason = next.reason || next.details || null;
          next.created_at = next.created_at || next.timestamp || undefined;
          delete next.details;
          delete next.timestamp;
          return next;
        });
        return originalInsert(payload, options);
      }
      if (table === "bookings") {
        const source = rows[0] || {};
        const payload = {
          customer_id: dailyTravelIsUuid(source.customer_id)
            ? source.customer_id
            : null,
          company_id: dailyTravelIsUuid(source.company_id)
            ? source.company_id
            : null,
          branch_id: dailyTravelIsUuid(source.branch_id) ? source.branch_id : null,
          schedule_id: dailyTravelIsUuid(source.schedule_id)
            ? source.schedule_id
            : null,
          route_id: dailyTravelIsUuid(source.route_id) ? source.route_id : null,
          passenger_count:
            Number(source.passenger_count) || source.seat_numbers?.length || 1,
          seat_numbers: source.seat_numbers || [],
          passenger_details: source.passenger_details || [],
          base_fare: Number(source.base_fare) || Number(source.total_amount) || 0,
          admin_charge: Number(source.admin_charge) || 0,
          flutterwave_charge: Number(source.flutterwave_charge) || 0,
          total_amount: Number(source.total_amount) || 0,
          currency: source.currency || "UGX",
          status: source.status || "confirmed",
          payment_status: source.payment_status || "successful",
        };
        return originalInsert(payload, options)
          .select("id,booking_reference")
          .single()
          .then(async ({ data, error }) => {
            if (!error && data?.id) {
              await dailyTravelSupabase.from("payments").insert({
                booking_id: data.id,
                company_id: payload.company_id,
                customer_id: payload.customer_id,
                amount: payload.total_amount,
                base_amount: payload.base_fare,
                admin_amount: payload.admin_charge,
                flutterwave_amount: payload.flutterwave_charge,
                currency: payload.currency,
                payment_method: source.payment_method || "mtn_momo",
                provider_reference: source.provider_reference || data.booking_reference,
                provider_status: "successful",
                status: "successful",
                settlement_status: "pending",
              });
              const seats = Array.isArray(payload.seat_numbers)
                ? payload.seat_numbers
                : [];
              if (seats.length) {
                await dailyTravelSupabase.from("tickets").insert(
                  seats.map((seat) => ({
                    booking_id: data.id,
                    passenger_name: source.passenger_name || null,
                    seat_number: String(seat),
                    status: "valid",
                  })),
                );
              }
            }
